name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  powershell:
    name: PSScriptAnalyzer + Pester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $results = @(foreach ($tree in './src', './Start-MsScripter.ps1') {
            if (Test-Path $tree) { Invoke-ScriptAnalyzer -Path $tree -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 }
          })
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($results.Count -gt 0) { throw "PSScriptAnalyzer found $($results.Count) issue(s)." }
          Write-Host 'PSScriptAnalyzer: no warnings or errors.'

      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0 -SkipPublisherCheck
          Invoke-Pester -Path ./tests -CI
